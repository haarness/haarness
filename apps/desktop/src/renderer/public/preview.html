<!doctype html><html><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob: https://unpkg.com; style-src 'unsafe-inline' https://unpkg.com; img-src data: blob: https://unpkg.com; font-src data: https://unpkg.com; media-src data: blob:; connect-src 'none'; frame-src blob: data:; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>Preview sandbox</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block;overflow:hidden}</style></head><body>
<script>
// Only the app can replace this frame. Generated pages cannot access their opaque owner.
let frame, key;
addEventListener('message', event => {
  const data = event.data;
  if (event.source === parent && data && data.type === 'render' && typeof data.html === 'string') {
    key = data.preview;
    if (frame) frame.remove();
    frame = document.createElement('iframe');
    frame.title = 'Preview content';
    frame.setAttribute('sandbox', 'allow-scripts allow-downloads');
    frame.setAttribute('referrerpolicy', 'no-referrer');
    frame.srcdoc = data.html;
    document.body.append(frame);
  } else if (frame && event.source === frame.contentWindow && data && data.preview === key) {
    parent.postMessage(data, '*');
  }
});
parent.postMessage({type:'preview-host-ready'}, '*');
</script></body></html>
