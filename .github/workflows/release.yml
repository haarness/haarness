name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable v-prefixed tag (CLI and Desktop versions must match)
        required: true
      channel:
        type: choice
        options: [preview, stable]
        default: preview
      publish:
        type: boolean
        description: Publish all verified platforms to the configured Cloud release service
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: mac, arch: arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: mac, arch: x64, target: x86_64-apple-darwin }
          # Linux builds link against glibc 2.17 (as OpenTUI and Bun do), not the
          # runner's own, so they run on every maintained distribution.
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64, target: aarch64-unknown-linux-gnu, glibc: '2.17' }
          # Bun's baseline build also runs on x64 processors without AVX2.
          - { os: ubuntu-24.04, platform: linux, arch: x64, target: x86_64-unknown-linux-gnu, glibc: '2.17', bun: bun-linux-x64-baseline }
          - { os: windows-11-arm, platform: win, arch: arm64, target: aarch64-pc-windows-msvc }
          - { os: windows-latest, platform: win, arch: x64, target: x86_64-pc-windows-msvc, bun: bun-windows-x64-baseline }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.tag }}' }
      - uses: oven-sh/setup-bun@v2
        if: '!matrix.bun'
        with: { bun-version: 1.3.14 }
      - uses: oven-sh/setup-bun@v2
        if: matrix.bun
        with: { bun-download-url: 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/${{ matrix.bun }}.zip' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.94.0, targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
      - name: Install the glibc-pinning linker
        if: matrix.glibc
        run: python -m pip install ziglang==0.14.1 cargo-zigbuild==0.23.4
      - name: Verify release tag and versions
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          version=tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          assert os.environ['RELEASE_TAG']=='v'+version
          assert json.loads(pathlib.Path('apps/desktop/package.json').read_text())['version']==version
          PY
      - run: cargo test --workspace
      - name: Public release URL verification regression
        run: python scripts/test-release-publish.py
      - run: npm --prefix sdks/typescript ci
      - run: npm --prefix sdks/typescript run build
      - run: npm --prefix sdks/typescript test
      - run: npm --prefix packages/browser-driver ci
      - run: npm run driver:test
      # The CLI carries Haarness for Chrome so a CLI-only install can set up
      # Chrome. Every later cargo build (Desktop packaging too) keeps the
      # variable, so none of them replaces the binary with one without it.
      - name: Build Haarness for Chrome for the CLI
        shell: bash
        run: |
          npm --prefix apps/browser-extension ci
          npm --prefix apps/browser-extension run build
          echo "HAARNESS_EMBED_BROWSER_EXTENSION=${{ github.workspace }}/apps/browser-extension/dist/chrome" >> "$GITHUB_ENV"
      # Every later step (installer and package checks, Desktop packaging,
      # collection) uses this one binary through HAARNESS_BIN.
      - name: Build the CLI
        shell: bash
        run: |
          # Always name the target: a runner's host toolchain may not match
          # the architecture this job publishes (windows-11-arm).
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --release -p haarness-cli --target "${{ matrix.target }}.${{ matrix.glibc }}"
          else
            cargo build --release -p haarness-cli --target "${{ matrix.target }}"
          fi
          binary="target/${{ matrix.target }}/release/haarness${{ runner.os == 'Windows' && '.exe' || '' }}"
          echo "HAARNESS_BIN=${{ github.workspace }}/$binary" >> "$GITHUB_ENV"
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/desktop test
      - name: Installer verification
        if: runner.os != 'Windows'
        run: python scripts/test-release-install.py
      # install.ps1 under PowerShell 7 everywhere; on Windows it also installs
      # the release binary over a previous copy.
      - name: PowerShell installer verification
        run: python scripts/test-release-install-ps1.py
      - name: macOS quarantine regression
        if: runner.os == 'macOS'
        run: python scripts/test-release-quarantine.py
      # Each OS takes only its own certificate. `macOS && MAC_CSC_LINK || WIN_CSC_LINK` handed a Mac runner the
      # Windows certificate whenever MAC_CSC_LINK was empty, so this check passed with the wrong one.
      - name: Require public distribution signing for stable
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          CSC_LINK: ${{ (runner.os == 'macOS' && secrets.MAC_CSC_LINK) || (runner.os == 'Windows' && secrets.WIN_CSC_LINK) || '' }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$CHANNEL" = stable ] && [ "$RUNNER_OS" != Linux ]; then
            test -n "$CSC_LINK" || { echo "Stable Desktop on $RUNNER_OS requires its own signing certificate"; exit 1; }
            if [ "$RUNNER_OS" = macOS ]; then
              test -n "$CSC_NAME" && test -n "$APPLE_API_KEY" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER" ||
                { echo 'Stable macOS requires Developer ID and notarization credentials'; exit 1; }
            fi
          fi
      # electron-builder hands APPLE_API_KEY to @electron/notarize as the PATH of the App Store Connect .p8 key, not
      # its contents. The secret holds the key itself (its PEM, or base64 of it); the file lives in the runner's
      # temporary directory, which is wiped with the job.
      - name: Write the notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_CONTENT" ]; then exit 0; fi
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID:-notarization}.p8"
          umask 077
          case "$APPLE_API_KEY_CONTENT" in
            *'-----BEGIN PRIVATE KEY-----'*) printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key" ;;
            *) printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$key" 2>/dev/null || true ;;
          esac
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$key" ||
            { rm -f "$key"; echo 'APPLE_API_KEY is neither a .p8 key nor base64 of one'; exit 1; }
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Package CLI and Desktop
        shell: bash
        env:
          CSC_LINK: ${{ (runner.os == 'macOS' && secrets.MAC_CSC_LINK) || (runner.os == 'Windows' && secrets.WIN_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ (runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD) || (runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD) || '' }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then export APPLE_API_KEY="$APPLE_API_KEY_PATH"; fi
          args=()
          if [ "$RUNNER_OS" = macOS ] && [ -n "$CSC_NAME" ]; then args+=("--config.mac.identity=$CSC_NAME"); fi
          npm --prefix apps/desktop run package -- --${{ matrix.platform }} --${{ matrix.arch }} "${args[@]}"
      - name: Verify packaged backend and JS runtime
        shell: bash
        run: |
          python scripts/test-release-package.py
          python scripts/release.py collect --binary "$HAARNESS_BIN"
      # The glibc floor, the .deb/AppImage contents, and the CLI on the oldest
      # supported distributions (in Docker, which Linux runners provide).
      - name: Linux portability
        if: runner.os == 'Linux'
        run: python scripts/test-release-linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/releases/*
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: releases
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.tag }}' }
      - uses: actions/download-artifact@v4
        with: { pattern: 'release-*', path: dist/releases, merge-multiple: true }
      - name: Publish and verify all binary downloads
        env:
          HAARNESS_RELEASE_TOKEN: ${{ secrets.HAARNESS_RELEASE_TOKEN }}
          HAARNESS_RELEASE_URL: ${{ vars.HAARNESS_RELEASE_URL }}
          CHANNEL: ${{ inputs.channel }}
        # publish refuses a Mac Desktop without collect's Gatekeeper record (Developer ID, notarized); a preview built
        # without the Mac secrets may still go out unsigned, stable never.
        run: python scripts/release.py publish --index dist/releases/index-*.json --url "$HAARNESS_RELEASE_URL" --channel "$CHANNEL" --receipt dist/releases/receipt.json ${{ inputs.channel != 'stable' && '--allow-unsigned' || '' }}
      # The same files on the tag's GitHub release: a draft until GitHub reports every size and SHA-256.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: python scripts/release.py github --index dist/releases/index-*.json --repo "$GITHUB_REPOSITORY" --channel "$CHANNEL"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: release-receipt, path: dist/releases/receipt.json }
