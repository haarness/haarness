name: ci
on:
  push:
    branches: [win/fail1107-wip]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Git for Windows on this runner
        shell: pwsh
        run: |
          Get-Command git | Format-List Source
          & "C:\Program Files\Git\bin\bash.exe" -lc 'echo "bash $BASH_VERSION in $(pwd -W)"; command -v ls grep sed cygpath'
          "login bash: " + (Measure-Command { & "C:\Program Files\Git\bin\bash.exe" -lc 'true' }).TotalMilliseconds + " ms"
          "cmd: " + (Measure-Command { cmd /d /s /c "exit 0" }).TotalMilliseconds + " ms"
      - name: Git Bash background work and job objects
        shell: pwsh
        continue-on-error: true
        run: .github/job-probe.ps1
      - run: cargo fmt --all -- --check
      # Main's own Windows job stops here today (process_tree.rs parse_table, unused on Windows).
      - run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true
      - name: The new Windows tests, with their output
        run: cargo test -p haarness-ripgrep -p haarness-core -p haarness-server --lib --no-fail-fast -- --nocapture git_bash agent_shell windows_paths the_shell_tool_names a_file_deeper_than_260 git_bash_drive_paths
      - name: Every test
        run: cargo test --workspace --no-fail-fast
