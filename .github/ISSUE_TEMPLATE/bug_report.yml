name: Bug report
description: Something in Haarness does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems must not be reported here — see SECURITY.md.
        Please redact API keys, tokens and private file contents from everything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. haarness …
        2. …
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      multiple: true
      options: [CLI / headless run, TUI, Desktop, Chrome extension, Server / API, SDK (TypeScript), SDK (Python), ACP / editor integration, Install / update]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Haarness version
      description: Output of `haarness --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and terminal
      placeholder: macOS 26 arm64, Ghostty
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: anthropic / claude-sonnet-5
  - type: textarea
    id: logs
    attributes:
      label: Logs and `haarness doctor` output
      description: For the Chrome extension, also paste `haarness browser status --json` and the Chrome version from chrome://version.
      render: text
